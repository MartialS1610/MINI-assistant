name: Actualites automobiles MINI Assistant

on:
  schedule:
    # Deux fois par jour : 06:15 et 18:15 UTC
    - cron: "15 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-automotive-news
  cancel-in-progress: true

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generer news.json depuis les flux RSS
        run: python scripts/update_news.py

      - name: Enregistrer le flux actualise
        run: |
          if git diff --quiet -- news.json; then
            echo "Aucune modification des actualites."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Actualiser les actualites automobiles"
          git push
